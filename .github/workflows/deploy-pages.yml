name: Deploy to GitHub Pages

# The Vercel deployment is driven by Vercel's own Git integration and is not
# affected by this workflow. This is the second, independent target: a fully
# static build that stays reachable from mainland China, where *.vercel.app is
# DNS-blocked. Switched on by NEXT_OUTPUT_EXPORT alone, so the Vercel build of
# this same commit is unchanged.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race for the same Pages slot.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_OUTPUT_EXPORT: "1"
          # The repo owns zhecheng-portfolio.site, so the site is served from
          # the root of that domain. NEXT_PUBLIC_BASE_PATH must stay unset
          # here: with it set, Next rewrites every asset URL to
          # /zhecheng-portfolio/_next/... and the site 404s on its own domain.
          NEXT_PUBLIC_SITE_URL: "https://zhecheng-portfolio.site"

      # out/ copies all of public/, including plates no page references.
      - run: node scripts/prune-static-output.mjs out

      # GitHub Pages reads the custom domain from a CNAME file at the root of
      # the published artifact. Without it the deploy is published under
      # <user>.github.io/<repo> instead of on the domain.
      #
      # .nojekyll stops Pages from running Jekyll over the artifact. Jekyll
      # skips every path that starts with "_", which would delete _next/ — the
      # directory that carries the CSS and JS.
      - name: Write Pages marker files
        run: |
          echo zhecheng-portfolio.site > out/CNAME
          touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
